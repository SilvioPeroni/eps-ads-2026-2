spring:
  application:
    name: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eps_ads}
    username: ${DB_USERNAME:eps_ads}
    password: ${DB_PASSWORD:eps_ads_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8888}

jwt:
  secret: ${JWT_SECRET:local-only-change-this-secret-before-deployment-2026}
